<!DOCTYPE html>
<html lang="nl">
<head>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
  <!-- Make sure you put this AFTER Leaflet's CSS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
  
  <!-- Registreer bij https://fontawesome.com -->
  <script src="https://kit.fontawesome.com/e766bcebc4.js" crossorigin="anonymous"></script>
  <style>
    #map {
    height:400px;
    }

    /* Zie: https://gist.github.com/adriennn/4678d585ac3774650c16 */
    .fontawesome_icon{
    color: green;   
    }
  </style>
</head>
<body>
  <div id="header">
  <h2>GeoJSON inladen</h2>
  </div>
  <div id="map"></div>
    <script>

        const osm = L.tileLayer('https://{s}.tile.osm.org/{z}/{x}/{y}.png')

        const map = L.map('map', {
            center: [52.3565363874106, 5.22309285574719],
            zoom: 16,
          layers: [osm]
        });
        
        const fontAwesomeIcon = L.divIcon({
            html: '<i class="fa-solid fa-school fa-4x"></i>',
            iconSize: [20, 20],
            className: 'fontawesome_icon'
        });

        const xmlhttp = new XMLHttpRequest();
        xmlhttp.onload = function() {
          const myObj = JSON.parse(this.responseText);
          let jsonlayer = L.geoJson(myObj, {
          onEachFeature: onEachFeature,
          pointToLayer: function (ftr, latlng) {
              return L.marker([latlng.lat, latlng.lng], {icon: fontAwesomeIcon})
            }
          }).addTo(map);
          
          function onEachFeature(feature, layer) {
            layer.bindPopup('<b>' + feature.properties.naam + '</b>', {width:'600px'});
          }
          
        };
        xmlhttp.open("GET", "Aeres.geojson");
        xmlhttp.send();

    </script>
</body>
</html>
